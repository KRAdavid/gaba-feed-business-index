name: Install business inquiry form

on:
  push:
    branches:
      - main
    paths:
      - "docs/assets/inquiry-form.css"
      - "docs/assets/inquiry-form.js"
      - "scripts/patch_inquiry_form.py"
      - "tests/test_patch_inquiry_form.py"
      - ".github/workflows/install-inquiry-form.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: business-inquiry-form
  cancel-in-progress: true

jobs:
  install-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate inquiry form assets
        run: |
          node --check docs/assets/inquiry-form.js
          python -m py_compile scripts/patch_inquiry_form.py
          python -m unittest tests/test_patch_inquiry_form.py -v

      - name: Install inquiry form asset references
        run: python scripts/patch_inquiry_form.py

      - name: Commit patched public page
        run: |
          git config user.name "cellpinda-site-bot"
          git config user.email "cellpinda-site-bot@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Inquiry form references already installed"
          else
            git commit -m "feat: activate structured business inquiry form [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify deployable files
        run: |
          test -f docs/index.html
          test -f docs/assets/inquiry-form.css
          test -f docs/assets/inquiry-form.js
          python scripts/patch_inquiry_form.py --check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public index
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
