      - name: Patch dashboard static/API merge
        run: python scripts/patch_frontend_v2.py

      - name: Collect, classify and publish
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: |
          DAYS="${{ github.event.inputs.since_days || '30' }}"
          python scripts/auto_intelligence_v2.py --since-days "$DAYS"
          python scripts/auto_intelligence_v2.py --validate-only

      - name: Write run summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          status = json.loads(Path("docs/data/update_status.json").read_text(encoding="utf-8"))
          counts = status.get("counts", {})
          print("## GABA Feed Intelligence v2")
          print(f"- 상태: **{status.get('status', 'unknown')}**")
          print(f"- 공개 자료: **{counts.get('auto_published', 0)}건**")
          print(f"- 검토 대기: **{counts.get('review_queue', 0)}건**")
          print(f"- 데이터 기준시각: `{status.get('updated_at', '')}`")
          PY

      - name: Commit installed files and material data changes
        run: |
          git config user.name "gaba-intelligence-bot"
          git config user.email "gaba-intelligence-bot@users.noreply.github.com"
          git add \
            scripts/auto_intelligence_v2.py \
            scripts/patch_frontend_v2.py \
            config/intelligence_sources_v2.json \
            config/curated_intelligence.json \
            tests/test_auto_intelligence_v2.py \
            tests/test_patch_frontend_v2.py \
            AUTO_UPDATE.md \
            docs/index.html \
            docs/data/auto_intelligence.json \
            docs/data/knowledge_base.json \
            docs/data/update_status.json \
            docs/data/index.json \
            data/auto_review_queue.json \
            data/auto_intelligence_state.json

          if git diff --cached --quiet; then
            echo "No material intelligence changes"
            exit 0
          fi

          git commit -m "chore: install/update verified GABA feed intelligence v2 [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 4))
          done
          exit 1
