name: Auto-update GABA feed intelligence v2

on:
  schedule:
    - cron: "20 18 * * *" # 03:20 Asia/Seoul, daily
  workflow_dispatch:
    inputs:
      since_days:
        description: "Research lookback period in days"
        required: false
        default: "30"
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-intelligence.yml"
      - "scripts/auto_intelligence_v2.py"
      - "scripts/patch_frontend_v2.py"
      - "config/intelligence_sources_v2.json"
      - "config/curated_intelligence.json"
      - "tests/test_auto_intelligence_v2.py"
      - "tests/test_patch_frontend_v2.py"

permissions:
  contents: write

concurrency:
  group: auto-gaba-intelligence-v2
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap v2 files when missing
        run: |
          required=(
            scripts/auto_intelligence_v2.py
            scripts/patch_frontend_v2.py
            config/intelligence_sources_v2.json
            config/curated_intelligence.json
            tests/test_auto_intelligence_v2.py
            tests/test_patch_frontend_v2.py
          )
          missing=0
          for path in "${required[@]}"; do
            if [[ ! -f "$path" ]]; then missing=1; fi
          done
          if [[ "$missing" -eq 0 ]]; then
            echo "GABA intelligence v2 files already installed"
            exit 0
          fi
          mkdir -p /tmp/gaba-v2/files
          cat > /tmp/gaba-v2/package.b64 <<'PAYLOAD'
