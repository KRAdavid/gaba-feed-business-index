name: Deploy GABA public index v2

on:
  workflow_run:
    workflows:
      - "Auto-update GABA feed intelligence v2"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/deploy-public-index-v2.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-v2
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify public index files
        run: |
          test -f docs/index.html
          test -f docs/assets/inquiry-form.css
          test -f docs/assets/inquiry-form.js
          test -f docs/assets/inquiry-delivery-fix.css
          test -f docs/assets/inquiry-delivery-fix.js
          test -f docs/assets/inquiry-apps-script.js
          test -f docs/assets/calculator-scenarios.css
          test -f docs/assets/calculator-scenarios.js
          test -f docs/assets/order-guide.css
          test -f docs/assets/order-guide.js
          test -f docs/assets/visitor-decision-cards.css
          test -f docs/assets/visitor-decision-cards.js
          test -f docs/assets/cta-emphasis.css
          test -f docs/assets/cta-emphasis.js
          test -f docs/assets/hero-banner-rotator.css
          test -f docs/assets/hero-title-focus.css
          test -f docs/assets/hero-banner-rotator.js
          test -f docs/assets/product-split-selector.css
          test -f docs/assets/product-split-selector.js
          test -f docs/assets/lab-section.css
          test -f docs/assets/lab-section.js
          test -f docs/assets/material-page.css
          test -f docs/assets/technical-documents.css
          test -f docs/assets/technical-documents.js
          test -f docs/assets/b2b-operations.css
          test -f docs/assets/b2b-operations.js
          test -f docs/assets/public-copy-polish.css
          test -f docs/assets/public-copy-polish.js
          test -f docs/data/index.json
          test -f docs/data/auto_intelligence.json
          test -f docs/data/knowledge_base.json
          test -f docs/data/update_status.json
          test -f docs/data/technical_documents.json
          test -f docs/data/b2b_operations.json
          test -f docs/data/platform_health.json
          test -f docs/data/evidence_claim_matrix.json
          test -s docs/downloads/GABA_Crude_Specification_v1.pdf
          test -f docs/downloads/GABA_Feed_Business_Model_Speech_Deck_v1.pdf
          test -f docs/downloads/GABA_Caremix_Specification_v1.pdf
          test -f docs/materials/gaba-crude-specification.html
          test -f docs/materials/breeder-pig-gaba-proposal.html
          test -f docs/materials/australia-wagyu-gaba-assessment.html
          test -f docs/materials/gaba-feed-introduction.html
          test -f docs/materials/cellpinda-life-science-lab.html

          grep -q 'assets/inquiry-form.js' docs/index.html
          grep -q 'assets/inquiry-apps-script.js' docs/index.html
          grep -q 'assets/calculator-scenarios.js' docs/index.html
          grep -q 'assets/order-guide.js' docs/index.html
          grep -q 'assets/visitor-decision-cards.js' docs/index.html
          grep -q 'assets/cta-emphasis.js' docs/index.html
          grep -q 'assets/hero-banner-rotator.js' docs/index.html
          grep -q 'assets/product-split-selector.js' docs/index.html
          grep -q 'assets/lab-section.js' docs/index.html
          grep -q 'assets/technical-documents.js' docs/index.html
          grep -q 'assets/b2b-operations.js' docs/index.html
          grep -q 'assets/b2b-operations.js' docs/assets/technical-documents.js
          grep -q 'assets/public-copy-polish.js' docs/index.html

          node --check docs/assets/inquiry-form.js
          node --check docs/assets/inquiry-apps-script.js
          node --check docs/assets/calculator-scenarios.js
          node --check docs/assets/order-guide.js
          node --check docs/assets/visitor-decision-cards.js
          node --check docs/assets/cta-emphasis.js
          node --check docs/assets/hero-banner-rotator.js
          node --check docs/assets/product-split-selector.js
          node --check docs/assets/lab-section.js
          node --check docs/assets/technical-documents.js
          node --check docs/assets/b2b-operations.js
          python scripts/check_b2b_platform.py
          node --check docs/assets/b2b-operations.js
          node --check docs/assets/public-copy-polish.js
          python -m py_compile scripts/check_b2b_platform.py

          python - <<'PY'
          import json
          from pathlib import Path

          required_json = [
              Path("docs/data/index.json"),
              Path("docs/data/auto_intelligence.json"),
              Path("docs/data/knowledge_base.json"),
              Path("docs/data/update_status.json"),
              Path("docs/data/technical_documents.json"),
              Path("docs/data/b2b_operations.json"),
              Path("docs/data/platform_health.json"),
              Path("docs/data/evidence_claim_matrix.json"),
          ]

          for path in required_json:
              json.loads(path.read_text(encoding="utf-8"))
              print("validated", path)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public index
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
